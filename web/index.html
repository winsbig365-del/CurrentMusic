<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>CurrentMusic</title>
  <link rel="icon" href="brand-icon.png?v=sage1" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=sage1">
  <script>
    if (location.hostname !== 'cm.local' && /^\/app(?:\/|$)/.test(location.pathname)) {
      var cmBase = document.createElement('base');
      cmBase.href = '/app/';
      document.head.appendChild(cmBase);
    }
  </script>
  <script>
    var REC = 'rec-1.28.74';
    try {
      if (localStorage.getItem('cm.recReset') !== REC) {
        localStorage.setItem('cm.uiPreset', 'cmx');
        localStorage.removeItem('cm.glassBlur');
        localStorage.removeItem('cm.glassTint');
        localStorage.setItem('cm.recReset', REC);
        window.__cmRecReset = true;
      }
    } catch (e) { /* ignore */ }
    try {
      var bootTheme = localStorage.getItem('cm.theme') || 'auto';
      document.documentElement.classList.add('mdui-theme-' + (bootTheme === 'dark' || bootTheme === 'light' ? bootTheme : 'auto'));
      var p = localStorage.getItem('cm.uiPreset');
      if (p === 'frost' || p === 'glass' || p === 'cmx') document.documentElement.setAttribute('data-ui-preset', p);
      else if (p !== 'md3') document.documentElement.setAttribute('data-ui-preset', 'cmx');
      var bg = localStorage.getItem('cm.bgImage');
      if (bg) document.documentElement.style.setProperty('--cm-bg-image', 'url("' + bg.replace(/["\\]/g, '\\$&') + '")');
      var gb = parseFloat(localStorage.getItem('cm.glassBlur'));
      if (isFinite(gb)) document.documentElement.style.setProperty('--frs-lens-blur', String(gb));
      var gt = localStorage.getItem('cm.glassTint');
      if (gt !== null && gt !== '') document.documentElement.style.setProperty('--frs-alpha', gt);
    } catch (e) { /* ignore */ }
  </script>
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior-y: none; }
    body { font-family: Inter, "Segoe UI", sans-serif; }
    #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: #f7f2fa; background: rgb(var(--mdui-color-surface, 247, 242, 250)); }
    #boot .cm-loading-indicator { width: 64px; height: 64px; }
    @media (prefers-color-scheme: dark) { #boot { background: #141218; background: rgb(var(--mdui-color-surface, 20, 18, 24)); } }

    .cm-now-playing {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 24px));
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(26, 22, 32, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
      z-index: 90;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .cm-now-playing[hidden] { display: none; }
    .cm-now-playing-art {
      width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #8f5cf6, #4ec3ff); display: grid; place-items: center; color: white; font-size: 20px; flex-shrink: 0;
    }
    .cm-now-playing-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cm-now-playing-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .cm-now-playing-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.78; }
    .cm-now-playing-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cm-now-playing-artist { font-size: 12px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cm-now-playing-actions { display: flex; align-items: center; gap: 8px; }
    .cm-now-playing-actions button {
      width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); color: inherit; cursor: pointer;
    }
    .cm-now-playing-actions button.primary { background: #b98cff; color: #160d26; }
    @media (max-width: 640px) {
      .cm-now-playing { bottom: 72px; }
      .cm-now-playing-title { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="CurrentMusic is loading"><!-- CM_LOADING_INDICATOR --></div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      boot.setAttribute('data-loading-start', String(performance.now()));
      boot.addEventListener('animationstart', function (event) {
        if (event.animationName === 'cmIndicatorMorph') boot.setAttribute('data-loading-start', String(performance.now()));
      });
    })();
  </script>

  <header id="topbar">
    <div id="brandLock"><img src="brand-icon.png?v=sage1" alt="" width="32" height="32"><b>CurrentMusic</b></div>
    <div id="pageTitle">CurrentMusic</div>
    <div id="topActs">
      <a id="topSearch" href="#/search" class="material-icons-outlined" title="Search">search</a>
      <span id="topAction" class="material-icons-outlined" title="Settings">settings</span>
    </div>
  </header>
  <a id="topAccount" href="#/user" aria-label="My account" hidden></a>

  <main id="out"></main>

  <div id="mini"></div>

  <div id="nowPlayingBar" class="cm-now-playing" hidden aria-live="polite" aria-label="Now playing">
    <div class="cm-now-playing-art" id="nowPlayingArt"><span class="material-icons-outlined">music_note</span></div>
    <div class="cm-now-playing-meta">
      <span class="cm-now-playing-label">Now Playing</span>
      <div class="cm-now-playing-title" id="nowPlayingTitle">No track selected</div>
      <div class="cm-now-playing-artist" id="nowPlayingArtist">Pick a song to begin</div>
    </div>
    <div class="cm-now-playing-actions">
      <button type="button" class="material-icons-outlined" id="nowPlayingPrev" aria-label="Previous">skip_previous</button>
      <button type="button" class="material-icons-outlined primary" id="nowPlayingToggle" aria-label="Play or pause">play_arrow</button>
      <button type="button" class="material-icons-outlined" id="nowPlayingNext" aria-label="Next">skip_next</button>
    </div>
  </div>

  <nav id="bottomNav">
    <span id="navDrop" aria-hidden="true"></span>
    <a href="#/home" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">home</span></span><span>Home</span></a>
    <a href="#/square" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">explore</span></span><span>Discover</span></a>
    <a href="#/library" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">library_music</span></span><span>Library</span></a>
    <a href="#/user" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">person</span></span><span>Me</span></a>
  </nav>

  <div id="playerOverlay" hidden></div>
  <div id="sheets"></div>

  <script>
    (function () {
      function updateNowPlaying(meta) {
        var bar = document.getElementById('nowPlayingBar');
        var title = document.getElementById('nowPlayingTitle');
        var artist = document.getElementById('nowPlayingArtist');
        var art = document.getElementById('nowPlayingArt');
        var toggle = document.getElementById('nowPlayingToggle');

        if (!bar || !title || !artist || !art || !toggle) return;

        if (!meta || !meta.name) {
          bar.hidden = true;
          return;
        }

        bar.hidden = false;
        title.textContent = meta.name || 'Unknown track';
        artist.textContent = meta.artists || meta.artist || 'Unknown artist';
        if (meta.pic) {
          art.innerHTML = '<img src="' + meta.pic + '?param=96y96" alt="Album art">';
        } else {
          art.innerHTML = '<span class="material-icons-outlined">music_note</span>';
        }

        if (window.__cmPlayer && typeof window.__cmPlayer.isPlaying === 'function') {
          toggle.textContent = window.__cmPlayer.isPlaying() ? 'pause' : 'play_arrow';
          toggle.setAttribute('aria-label', window.__cmPlayer.isPlaying() ? 'Pause' : 'Play');
        }
      }

      document.getElementById('nowPlayingPrev')?.addEventListener('click', function () {
        if (window.__cmPlayer && typeof window.__cmPlayer.prev === 'function') window.__cmPlayer.prev();
      });

      document.getElementById('nowPlayingNext')?.addEventListener('click', function () {
        if (window.__cmPlayer && typeof window.__cmPlayer.next === 'function') window.__cmPlayer.next();
      });

      document.getElementById('nowPlayingToggle')?.addEventListener('click', function () {
        if (window.__cmPlayer && typeof window.__cmPlayer.toggle === 'function') window.__cmPlayer.toggle();
      });

      function listen() {
        if (window.__cmPlayer && window.__cmPlayer.meta) updateNowPlaying(window.__cmPlayer.meta);
        if (window.__cmPlayer && typeof window.__cmPlayer.on === 'function') {
          window.__cmPlayer.on('state', function () {
            if (window.__cmPlayer && window.__cmPlayer.meta) updateNowPlaying(window.__cmPlayer.meta);
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', listen);
      } else {
        listen();
      }

      window.__cmSetNowPlaying = updateNowPlaying;
    })();
  </script>

  <script>
    (function () {
      var shown = false;
      function show(title, detail) {
        if (shown || window.__cmBooted) return;
        shown = true;
        var boot = document.getElementById('boot');
        if (!boot) return;
        var cycleAge = performance.now() - Number(boot.getAttribute('data-loading-start') || 0);
        if (boot.querySelector('.cm-loading-indicator') && cycleAge < 1137.5) {
          setTimeout(function () { shown = false; show(title, detail); }, 1137.5 - cycleAge + 80);
          return;
        }
        var ua = navigator.userAgent || '';
        var m = ua.match(/Chrome\/([0-9.]+)/);
        boot.innerHTML =
          '<div style="max-width:560px;margin:0 auto;padding:22px;font:14px/1.7 system-ui,sans-serif;color:#1d1b20">' +
            '<div style="font-size:calc(19px * var(--cm-fs, 1));font-weight:700;color:#b3261e;margin-bottom:6px">Startup failed: ' + title + '</div>' +
            '<div style="font-size:calc(12px * var(--cm-fs, 1));color:#49454f;margin-bottom:12px">CurrentMusic could not complete initialization. Please send the information below to the developer and try the options shown.</div>' +
            '<div style="background:#f7f2fa;border-radius:10px;padding:12px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto">' +
              (detail || '(No error details)').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
              '\n\nWebView: ' + (m ? ('Chrome ' + m[1]) : 'Unknown') +
              '\nUA: ' + ua +
            '</div>' +
            '<div style="margin:16px 0 4px;font-weight:600">Try these</div>' +
            '<ol style="margin:0;padding-left:20px;font-size:calc(13px * var(--cm-fs, 1));color:#49454f">' +
              '<li>Update Android System WebView or Chrome in the app store / device settings and reopen the app</li>' +
              '<li>Tap Retry below to reload</li>' +
              '<li>If it still fails, please send a screenshot of the details above</li>' +
            '</ol>' +
            '<div style="margin-top:18px;display:flex;gap:10px">' +
              '<button onclick="location.reload()" style="flex:1;height:44px;border:none;border-radius:22px;background:#6750a4;color:#fff;font-size:calc(15px * var(--cm-fs, 1))">Retry</button>' +
              '<button id="cmCopyDiag" style="height:44px;padding:0 18px;border-radius:22px;border:1px solid #79747e;background:transparent;font-size:calc(14px * var(--cm-fs, 1))">Copy info</button>' +
            '</div>' +
          '</div>';
        var pre = boot.querySelector('div > div:nth-child(3)');
        var btn = document.getElementById('cmCopyDiag');
        if (btn) btn.onclick = function () {
          try {
            var t = pre ? pre.textContent : detail;
            (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
              function () { btn.textContent = 'Copied'; },
              function () { btn.textContent = 'Long-press to copy'; }
            );
          } catch (e) { btn.textContent = 'Long-press to copy'; }
        };
      }
      window.__cmDiag = show;
      window.addEventListener('error', function (e) {
        if (window.__cmBooted) return;
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) {
          show('Script resource load failed', 'Please check network or CDN responses:\n' + e.target.src);
          return;
        }
        if (e.message || e.filename) show('Script execution error', (e.message || '') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (window.__cmBooted) return;
        var r = e.reason;
        show('Initialization exception', String((r && r.stack) || (r && r.message) || r));
      });
      setTimeout(function () {
        if (!window.__cmBooted && !shown) {
          show('Load timeout', 'The app could not start within 9 seconds. Please check the network, CDN responses, and browser console for details.');
        }
      }, 9000);
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
